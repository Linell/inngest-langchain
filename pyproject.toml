[project]
name = "inngest-langchain-example"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162",
    "inngest>=0.5.21",
    "inngest-langchain>=0.1.0",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "uvicorn>=0.54",
]

# TEMPORARY: inngest-langchain and `ctx.group._span` (inngest-py#404) are not
# released yet; install both from a sibling checkout of inngest-py (branch
# linell/inngest-langchain). Remove this block once they ship.
[tool.uv.sources]
inngest = { path = "../inngest-py/pkg/inngest", editable = true }
inngest-langchain = { path = "../inngest-py/pkg/inngest_langchain", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
